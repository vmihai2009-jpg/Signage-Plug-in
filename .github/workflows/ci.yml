name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Release-R2024, Release-R2025, Release-R2026]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build BGSignage.sln --configuration ${{ matrix.config }}
      # Run the real installer and uninstaller against the build (per-user, no admin rights).
      - name: Test installer
        shell: powershell
        run: |
          $year = '${{ matrix.config }}'.Substring('${{ matrix.config }}'.Length - 4)
          ./installer/Install.ps1 -Versions $year -NoPause
          $dir = "$env:APPDATA\Autodesk\Revit\Addins\$year"
          if (-not (Test-Path "$dir\BGSignage.addin")) { throw "no manifest" }
          if (-not (Get-ChildItem "$dir\BGSignage\engine" -Recurse -Filter BGSignage.Engine.dll)) { throw "no engine" }
          if (-not (Get-ChildItem "$dir\BGSignage\launcher" -Recurse -Filter BGSignage.Launcher.dll)) { throw "no launcher" }
          ./installer/Install.ps1 -Versions $year -Uninstall -NoPause
          if (Test-Path "$dir\BGSignage.addin") { throw "uninstall failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: BGSignage-${{ matrix.config }}
          path: |
            src/BGSignage.Launcher/bin/${{ matrix.config }}/**
            src/BGSignage.Engine/bin/${{ matrix.config }}/**

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run tests
        run: dotnet test tests/BGSignage.Tests/BGSignage.Tests.csproj
